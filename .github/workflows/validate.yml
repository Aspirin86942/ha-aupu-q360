name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy custom_components/aupu_q360
      - run: uv run python scripts/check_no_secrets.py

  ha-runtime:
    runs-on: ubuntu-latest
    env:
      AUPU_RUN_HA_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group ha-test
      - run: uv run --group ha-test pytest tests/ha_runtime -m ha_runtime -v

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: home-assistant/actions/hassfest@master
